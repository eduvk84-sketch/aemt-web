# ============================================================
# AEMT — netlify.toml
# Se publica SOLO la carpeta «web». Lo demás (documentos, la web
# antigua en «archivo») no sale a internet.
# ============================================================

[build]
  publish = "web"

# ── HTTPS y dominio único ────────────────────────────────────
[[redirects]]
  from = "http://aemtkd.es/*"
  to = "https://aemtkd.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aemtkd.es/*"
  to = "https://aemtkd.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aemtkd.es/*"
  to = "https://aemtkd.es/:splat"
  status = 301
  force = true

# ── El panel antiguo ya no existe: la Junta entra por Magestro ──
[[redirects]]
  from = "/admin"
  to = "https://magestro.es/login"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "https://magestro.es/login"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "https://magestro.es/login"
  status = 301
  force = true

[[redirects]]
  from = "/login.html"
  to = "https://magestro.es/login"
  status = 301
  force = true

# ── Área del abonado: entrada de Magestro con la imagen de la AEMT ──
[[redirects]]
  from = "/abonados"
  to = "https://magestro.es/acceso/asociacion-espanola-de-masters-de-taekwondo-aemt"
  status = 302
  force = true

# ── Cabeceras de seguridad (todas las páginas) ────────────────
# Todo se sirve desde la propia web: ni fuentes, ni scripts, ni
# analítica de terceros. El único destino externo es Magestro.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ── Caché ────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
