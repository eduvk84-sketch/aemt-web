<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">Emblema de la AEMT, Asociación Española de Masters de Taekwondo</title>
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C766"/>
      <stop offset=".55" stop-color="#C8942A"/>
      <stop offset="1" stop-color="#9C6E17"/>
    </linearGradient>
    <path id="arco" d="M100 100 m-72 0 a72 72 0 1 1 144 0 a72 72 0 1 1 -144 0"/>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#0D1E38"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#oro)" stroke-width="3"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#oro)" stroke-width="1.2" opacity=".55"/>
  <text font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#E8B84B">
    <textPath href="#arco" startOffset="50%" text-anchor="middle">MASTERS · TAEKWONDO · ESPAÑA · MMXXVI ·</textPath>
  </text>
  <!-- trayectoria de una patada: el arco que da nombre a la experiencia -->
  <path d="M56 118 C 74 70, 128 62, 146 92" fill="none" stroke="url(#oro)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="146" cy="92" r="5" fill="#F0C766"/>
  <text x="100" y="128" text-anchor="middle" font-family="'Bebas Neue', 'Impact', sans-serif" font-size="44" letter-spacing="3" fill="#FFFFFF">AEMT</text>
</svg>
